{% load static %}
{% if ai_answer %}
<div class="mt-3 pt-3 border-t border-slate-100">
    <p class="text-xs text-slate-400 mb-2">คำตอบนี้เป็นประโยชน์ไหม?</p>
    <div class="flex gap-2" id="ai-feedback-buttons-{{ feedback_widget_id }}">
        <button type="button" onclick="sendAIFeedback(true, '{{ feedback_widget_id }}')"
            class="px-4 py-1.5 bg-green-50 hover:bg-green-100 text-green-700 rounded-full text-xs font-bold transition">
            👍 มีประโยชน์
        </button>
        <button type="button" onclick="sendAIFeedback(false, '{{ feedback_widget_id }}')"
            class="px-4 py-1.5 bg-red-50 hover:bg-red-100 text-red-700 rounded-full text-xs font-bold transition">
            👎 ยังไม่ใช่
        </button>
    </div>
    <p class="hidden text-xs text-bio-dark font-bold mt-2" id="ai-feedback-thanks-{{ feedback_widget_id }}">
        🙏 ขอบคุณสำหรับความคิดเห็น!
    </p>
    <textarea id="ai-feedback-question-{{ feedback_widget_id }}" class="hidden">{{ ai_question }}</textarea>
    <textarea id="ai-feedback-answer-{{ feedback_widget_id }}" class="hidden">{{ ai_answer }}</textarea>
    <input type="hidden" id="ai-feedback-lesson-{{ feedback_widget_id }}" value="{{ feedback_lesson_id|default:'' }}">
</div>
<script>
    // 📌 ใช้ร่วมกันทั้งหน้า "ถาม AI" เดี่ยวๆ และกล่องที่ฝังในหน้าบทเรียน (โหลดซ้ำได้ ไม่มีปัญหาถ้ามีแค่กล่องเดียวต่อหน้า)
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let cookie of cookies) {
                cookie = cookie.trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    function sendAIFeedback(isHelpful, widgetId) {
        const question = document.getElementById(`ai-feedback-question-${widgetId}`).value;
        const answer = document.getElementById(`ai-feedback-answer-${widgetId}`).value;
        const lessonId = document.getElementById(`ai-feedback-lesson-${widgetId}`).value;

        fetch("{% url 'ai_feedback' %}", {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken'),
            },
            body: JSON.stringify({
                question: question,
                answer: answer,
                lesson_id: lessonId || null,
                is_helpful: isHelpful,
            }),
        })
        .then(res => res.json())
        .then(data => {
            if (data.ok) {
                document.getElementById(`ai-feedback-buttons-${widgetId}`).classList.add('hidden');
                document.getElementById(`ai-feedback-thanks-${widgetId}`).classList.remove('hidden');
            }
        })
        .catch(() => {
            // 📌 ส่ง feedback ไม่สำเร็จก็ปล่อยเงียบไว้ ไม่ควรไปรบกวนผู้ใช้งาน
        });
    }
</script>
{% endif %}
