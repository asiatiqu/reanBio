{% extends 'base.html' %}
{% load static %}

{% block title %}ตั้งรหัสผ่านใหม่สำเร็จ - reanBio{% endblock %}

{% block content %}
<div class="w-full max-w-md bg-white/90 backdrop-blur-md rounded-[40px] border border-white shadow-xl p-8 md:p-10 z-10 relative space-y-6 text-center">

    <a href="{% url 'home' %}" class="inline-block hover:scale-105 transition duration-300">
        <img src="{% static 'reanBio/images/reanbio.png' %}" alt="reanBio Logo"
            class="h-16 w-auto mx-auto object-contain">
    </a>

    <div class="space-y-2">
        <h2 class="text-2xl font-bold text-bio-dark">ตั้งรหัสผ่านใหม่สำเร็จแล้ว ✅</h2>
        <p class="text-slate-500 text-sm">
            ตอนนี้คุณสามารถเข้าสู่ระบบด้วยรหัสผ่านใหม่ได้เลย
        </p>
    </div>

    <a href="{% url 'login' %}"
        class="inline-block w-full py-3.5 bg-gradient-to-r from-bio-main to-bio-dark text-white font-bold rounded-full shadow-lg hover:shadow-xl hover:scale-[1.02] active:scale-95 transition duration-300 text-base">
        เข้าสู่ระบบ
    </a>

</div>
{% endblock %}
